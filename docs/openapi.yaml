openapi: 3.0.3
info:
  title: Austin Education Student Management API
  version: 1.0.0
  description: |
    预付费履约系统 API。课时 = 家长已付的钱 + 库存 + 排期承诺。
    所有时间均为 Australia/Melbourne 墙上时钟（ISO 8601 本地时间字符串，如 "2026-09-21T09:00:00+10:00"），服务端不做时区转换。
    认证：浏览器走 httpOnly Cookie `ae_token`；curl / Postman 走 `Authorization: Bearer <token>`。

    ## 两条全局契约不变量（客户端必须依赖，服务端必须保证）

    1. **空集合恒为 `[]`，绝不返回 `null`**。所有列表端点（`/classes`、`/classes/{id}/enrollments`、
       `/lessons`、`/follow-ups`、`/students`、`/students/{id}/credits`、`/leave-requests`）在无匹配时
       返回 `data: []`（分页端点返回 `data.items: []`），**不返回 `null`**。客户端 `.map()` 不得因空集合崩溃
       （`/students/{id}/credits` 曾返回 `items:null`，新学生页面直接崩）。

    2. **参数解析失败的处理，按参数角色分档（不是一刀切）**。此前非法值一律被静默忽略，
       导致过滤条件失效、整个结果集被返回；`GET /students?owner_admin_id=abc` 甚至返回过
       `code: -1`（与兜底 500 撞码，客户端无法区分）。

       | 参数角色 | 例子 | 非法值的行为 | 理由 |
       |---|---|---|---|
       | **过滤 / 作用域** | `owner_admin_id` `teacher_id` `weekday` `class_id` `student_id` `lesson_id` | **400 / code=40000** | 被忽略会返回调用者没要的数据 —— **正确性问题**，且可能构成越权读 |
       | **分页** | `limit` `page` | 回落默认值（20 / 1），不报错 | 只决定"取多少"，范围与作用域仍正确，且 `limit=abc` 报错对用户无价值 |
       | **排序** | `sort` | 回落 `updated_at DESC`，不报错 | 只决定顺序，取到的仍然是他要的数据，只是顺序非预期 —— **表现问题** |

       判据一句话：**参数被忽略后，返回的数据是否是调用者本来要看的那批？** 是 → 回落；
       不是 → 400。故 `sort` / `limit` 不适用 400，`owner_admin_id` 一类必须 400。
       细节见 ADR-010「契约不变量」与 ADR-011。

    ## 错误码

    | code | HTTP | 含义 |
    |---|---|---|
    | 0 | 200 | 成功 |
    | **40000** | **400** | **调用方输入错误，改请求即可成功**：数字型 query 无法解析（message 形如 `"weekday 必须是数字"`）、必填字段缺失（如 `"full_name 为必填"`）、日期格式非法（如 `"from_date 必须是 YYYY-MM-DD 格式"`）、枚举值非法（如 `"outcome 只能是 converted 或 lost"`） |
    | 40100 | 401 | 未登录 / token 失效 |
    | 40300 | 403 | 角色不允许 |
    | 40301 | 403 | R7：不是该学生的 owner；或 household 读别家孩子 |
    | 40400 | 404 | 资源不存在 |
    | 40901 | 409 | R3a：学生周时段重叠 |
    | 40902 | 409 | R3b：老师时段冲突 |
    | 40903 | 409 | R3c：班级已满 |
    | 40904 | 409 | R6：余额为 0，不能排课 |
    | 40905 | 409 | R1：该学生该科目已试听过 |
    | 40906 | 409 | 重复结算（幂等命中） |
    | **40907** | **409** | **学生不在该课次所属班级的在册名单中（`POST /leave-requests`）** |
    | **40908** | **409** | **请求本身合法，但当前业务状态不允许**：课次已取消（结算 / 请假）、课次已开始（请假）—— 调用方**改请求也无法成功**，故与 40000 分开 |
    | 42201 | 422 | R4：出勤状态非法（老师只能 present / absent） |
    | 42202 | 422 | R8：LLM 输出未通过白名单校验 |
    | 50000 | 500 | 未分类服务端错误（**兜底，不再使用 `-1`**） |

    LLM 不可用**不是错误**：HTTP 200 + `ai_status: unavailable`（见 ADR-006）。

    ## 角色权限矩阵（依据 router.go:52-112 的 RequireRoles，已逐条核对）

    越权访问返回 `403 / code=40300`（角色不允许）；staff 访问非自己学生返回 `403 / code=40301`（R7）。
    **注意 household 在多数端点上是 403 而不是"只看到自己"** —— 下表已区分这两种处理。

    | 端点 | admin | teacher | student (household) | 说明 |
    |---|---|---|---|---|
    | `POST /auth/login` `POST /auth/logout` `GET /auth/me` `GET /config` | 是 | 是 | 是 | 登录态 |
    | `GET /students` | 是 | 是 | **403** | household 不走列表，走 `/dashboard/household` |
    | `POST /students` `PATCH /students/{id}` `POST /students/{id}/transfer-owner` | 是 | **403** | **403** | 写路径仅 admin（R7） |
    | `GET /students/{id}` `GET /students/{id}/credits` `GET /students/{id}/ai-cards` | 是 | 是 | 是（**仅自己孩子**，越界 40301） | 数据范围内收敛 |
    | `POST /students/{id}/credit-packages` `POST /students/{id}/credit-adjustments` | 是 | **403** | **403** | 动钱的路径仅 admin |
    | `GET /trials` | 是（**仅自己名下学生的试听**） | 是（**仅自己任课的试听**） | **403** | 队列按归属收敛，口径同 `GET /follow-ups`（见该端点说明） |
    | `POST /trials` `POST /trials/{id}/outcome` `GET /follow-ups` `POST /follow-ups/{id}/complete` | 是（**且受 R7**：只可操作自己名下学生的记录，否则 40301） | **403** | **403** | 写路径仅 admin（R7）；`GET /follow-ups` 亦按 owner 收敛 |
    | `GET /classes` `GET /classes/{id}/enrollments` | 是 | 是 | 是（**结果按自己孩子收敛**） | 无 RequireRoles |
    | `POST /classes` `POST /classes/{id}/enrollments` `DELETE /classes/{id}/enrollments/{student_id}` | 是 | **403** | **403** | — |
    | `GET /subjects` `GET /teachers` | 是 | **403** | **403** | 建班选项 |
    | `GET /lessons` | 是 | 是 | 是（**按绑定学生在查询里收敛**） | 家长端要列课才能请假 |
    | `POST /lessons/generate` | 是 | **403** | **403** | — |
    | `POST /lessons/cancel-range` | 是 | 是（**限自己的课**） | **403** | R10 |
    | `GET /lessons/{id}/roster` `POST /lessons/{id}/attendance` `PATCH /lessons/{id}/attendance/{student_id}` | 是 | 是 | **403** | 出勤仅课堂两侧 |
    | `GET /leave-requests` | 是 | 是 | 是（**按自己孩子收敛**） | — |
    | `POST /leave-requests` | 是 | **403** | 是 | 请假由学生端发起（R4） |
    | `POST /ai/trial-conversion/{student_id}` `POST /ai/renewal-risk/{student_id}` | 是 | **403** | **403** | — |
    | `GET /dashboard/admin` | 是 | **403** | **403** | — |
    | `GET /dashboard/teacher` | 是 | 是 | **403** | admin 可代看以免老师请假时盲区 |
    | `GET /dashboard/household` | **403** | **403** | 是 | — |

    一句话原则：**写路径一律 admin（除请假与出勤）；读路径按"是不是他该看的"收敛；
    household 无任何管理端入口，只看得到自己孩子的数据。**

    ## 本文件的效力边界（必读）

    本规格**已向运行时实现对齐**，而非实现向规格对齐。逐项裁定见
    **`docs/decisions/ADR-011-contract-drift-reconciliation.md`**（含哪些端点以实现为准、
    哪些以规格为准、以及为什么）。凡与本文冲突处，**ADR-011 优先**。

    已知的意图与机制落差（诚实声明，避免误读本文件的效力）：
    ADR-010 曾规定"前端用 `openapi-typescript` 生成类型、不手写 DTO"。**该生成链路在本次交付中
    并未接上**（`frontend/package.json` 无 `gen:types`，`frontend/src/lib/types.ts` 为手写）。
    因此本文件当前的角色是**人工维护的对照契约与评审依据**，不是机器强制的类型源。
    接上生成步骤 + `openapi-diff` 的后续工作已登记在 `docs/decisions/OPEN-DECISIONS.md`。

    ⚠️ 契约状态（Phase 3 收尾）：本文件与 Go 实现曾在十余处不一致。经 ADR-011 逐项裁定后，
    其中可判定的部分**已在实现侧修正并逐条实测验证**（不是把规格改写成迁就代码）：
    `/auth/me` 的 `{user, student_ids}` 形状、`/students` 的 `can_write` 与 `has_more` 拼写、
    `owner_admin_id` 的 `me` 与非法值 400、`/leave-requests` 的按调用者收敛、
    `/students/:id/ai-cards` 的注册、以及 `low_credit[].weeks_left` 恒空字段的删除。

    诚实说明：本文件**仍不是**从代码生成的全量重写 —— 各端点的响应 schema 以
    `backend/internal/handler` 的实际响应为准，逐项差异与裁定理由见
    `docs/decisions/ADR-011-contract-drift-reconciliation.md` 的裁定表。
    本文档中标注“以运行时为准”的参数（如 `/students` 的 `sort`）已按实现校正，
    未实现的参数已删除而不是保留为“待确认”。
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发（Vite dev server 通过 server.proxy 代理 /api 到此）
  - url: https://{host}/api/v1
    description: 生产（Nginx 反代）
    variables:
      host:
        default: localhost

tags:
  - name: auth
  - name: students
  - name: credits
  - name: trials
  - name: followups
  - name: classes
  - name: lessons
  - name: leave
  - name: ai
  - name: dashboard

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "admin1" }
                password: { type: string, format: password }
      responses:
        '200':
          description: "登录成功（同时 Set-Cookie: ae_token）"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string, description: "供 curl / Postman 使用的 Bearer token" }
                          user: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出（清除 Cookie）
      responses:
        '200': { $ref: '#/components/responses/OkEmpty' }

  /auth/me:
    get:
      tags: [auth]
      summary: 当前登录者与其可见范围
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          student_ids:
                            type: array
                            description: "role=student 时该家庭账号绑定的学生"
                            items: { type: integer, format: int64 }

  /config:
    get:
      tags: [auth]
      summary: "业务阈值（R2 的 48h / R4 的 24h / R6 的余额阈值）的单一真源"
      description: |
        为什么需要这个端点：48 / 24 / 4 这三个阈值**都是假设值，没有外部基准**（见 OPEN-DECISIONS）。
        如果前端再抄一份，规则一改 UI 文案就会撒谎 —— 于是把阈值做成服务端下发的配置，
        前端只读不写（`MyCreditsPage.tsx:59`）。
        环境变量：`FOLLOWUP_SLA_HOURS`（默认 48）、`LEAVE_NOTICE_HOURS`（默认 24）、
        `LOW_CREDIT_THRESHOLD`（默认 4），见 `internal/config/config.go:11-18, 53-57`。
        **注意**：改这些值会同时改变服务端判定与前端文案，因此这是一份"规则配置"而不是"展示配置"。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Thresholds' }

  /students:
    get:
      tags: [students]
      summary: 学生列表
      description: |
        可见范围：admin 读全量；teacher 读自己教的班的学生。
        **household(role=student) 不能调用本端点 → `403 / 40300`**（router.go:62 的 RequireRoles 只含
        admin 与 teacher）—— 家长端不走学生列表，走 `GET /dashboard/household`。
        **空集合契约**：无匹配时 `data.items` 恒为 `[]`，**绝不返回 `null`**（客户端 `.map()` 不得因空集合崩溃）。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StudentStatus' }
        - name: q
          in: query
          description: 姓名模糊匹配
          schema: { type: string }
        - name: low_credit
          in: query
          description: "true 时只返回余额 <= 4 的学生（R6）"
          schema: { type: boolean }
        - name: owner_admin_id
          in: query
          description: "接受字面量 `me`（等价于当前登录 admin）或数字 id；**其它任何值一律 400 / code=40000**"
          schema: { type: string }
        - name: sort
          in: query
          description: |
            已按实现校正（service/student.go:125-131）。

            **被识别的取值只有两个**：`name`（按 `full_name ASC`）、
            `balance_asc`（按 `COALESCE(balance,0) ASC, full_name ASC`）。

            **不传、或传任何其它值**都回落到默认排序：`updated_at DESC, id DESC`。
            非识别值**不报 400**，静默回落 —— 这是刻意的，与 `owner_admin_id` 一类
            过滤参数不同：排序被忽略时范围与分页仍然正确，只是顺序非预期；
            而过滤参数被忽略会返回调用者没要的数据。前者是表现问题，后者是正确性问题，
            所以只有后者报了 400。

            因此这里**刻意不写 `enum`** —— `enum` 在 OpenAPI 中语义是「仅这些值合法」，
            而服务端并不校验（`sort=bogus` 实测返回 200）。契约不声明服务端没有的强制力。
            客户端若要约束，请自行在下拉框里只提供这两个值。
          schema: { type: string }
          example: balance_asc
        # 说明：契约此前还声明过一个 `order` 参数，但实现中并不存在（排序方向由 sort 自身
        # 决定），已删除。参数一旦写进契约就会被客户端当成可依赖的能力。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                default: []
                                items: { $ref: '#/components/schemas/StudentListItem' }
        '400':
          description: "数字型 query 参数无法解析：code=40000，例如 \"owner_admin_id 必须是数字或 me\""
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
    post:
      tags: [students]
      summary: 建档（咨询登记）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStudentRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Student' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /students/{id}:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [students]
      summary: 学生详情（档案 + 余额 + 在班 + 待跟进 + 最新 AI 卡）
      description: |
        读作用域：admin 读全量；teacher 读自己教的班的学生；**household(role=student) 只读自己的孩子，读别家孩子返回 403**（与 `/students/{id}/ai-cards` 一致）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StudentDetail' }
        '403':
          description: "code=40301：staff 非该学生 owner（R7），或 household 读别家孩子"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [students]
      summary: "更新学生档案（R7：admin 只能改 owner_admin_id = 自己的学生）"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStudentRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Student' }
        '403':
          description: "R7 违反：code=40301"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /students/{id}/transfer-owner:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [students]
      summary: 学生转给另一个 admin（追问：转归属）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_admin_id]
              properties:
                to_admin_id: { type: integer, format: int64 }
                reason: { type: string, maxLength: 255 }
      responses:
        '200': { $ref: '#/components/responses/OkStudent' }
        '403':
          description: "仅当前 owner 或 super_admin 可发起"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /students/{id}/credits:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [credits]
      summary: 余额与流水（只读）
      description: |
        读作用域：admin 读全量；teacher 读自己教的班的学生；**household 只读自己的孩子，读别家孩子返回 403**。
        **空集合契约（最重要）**：新学生没有任何流水时 `data.items` 恒为 `[]`，**绝不返回 `null`** —— 客户端 `.map()` 不得崩溃。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          balance: { type: integer, description: "SUM(credit_ledger.delta)；无流水时为 0" }
                          items:
                            type: array
                            default: []
                            items: { $ref: '#/components/schemas/LedgerEntry' }
                          total: { type: integer, default: 0 }
        '403':
          description: "code=40301：staff 非该学生 owner（R7），或 household 读别家孩子"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /students/{id}/credit-packages:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [credits]
      summary: "成交开账：建课时包 + 写首条 ledger（reason=purchase）"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePackageRequest' }
      responses:
        '201':
          description: 已开账
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          package: { $ref: '#/components/schemas/CreditPackage' }
                          balance: { type: integer }
        '403':
          description: "R7 违反：code=40301"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /students/{id}/credit-adjustments:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [credits]
      summary: "退款 / 补偿（追问：课时怎么退）。只 append 流水，不修改历史"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, note]
              properties:
                reason:
                  type: string
                  enum: [refund, manual_adjust]
                  description: "refund=退未消耗课时（服务端把余额归零并置 package=refunded）；manual_adjust=退某一节已扣的课"
                delta:
                  type: integer
                  description: "manual_adjust 时必填，通常为 +1；refund 时忽略（服务端自行计算）"
                lesson_id:
                  type: integer
                  format: int64
                  description: "manual_adjust 关联课次，可空"
                note: { type: string, maxLength: 255 }
      responses:
        '201':
          description: 已记账
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          entry: { $ref: '#/components/schemas/LedgerEntry' }
                          balance: { type: integer }

  /trials:
    get:
      tags: [trials]
      summary: 试听列表
      description: |
        **这是顾问的个人待办队列，不是学生目录**，因此按角色收口（handler/trial.go:41-66）：
        admin 只返回 `students.owner_admin_id = 自己` 的试听，teacher 只返回 `trials.teacher_id = 自己`
        的试听。两条谓词都拼进 SQL，**不留给客户端过滤**（否则"过滤失效 = 全量泄露"）。

        **为什么不与 R7 冲突**：R7 管的是**学生目录**（`DESIGN.md:116`：admin 可读全部学生、
        只可写 `owner_admin_id = self` 的），`GET /students` 至今仍全量返回并逐行带 `can_write`
        标记，那条读全量的能力没有被削弱。本端点是「今天我桌上有什么」，与同页、同角色门、
        同一文件的 `GET /follow-ups` 完全同口径 —— 把整家公司的名单铺到某个顾问的工作台上
        不是权限，而是噪音，用户实际反馈过这个 bug。历史上这里没有过滤，前端因此绕行改读
        `/dashboard/admin`（`frontend/src/pages/TodayPage.tsx:9-13` 的注释记录了那次绕行），
        而 LeadsPage 仍在直接调本端点，本轮把端点本身修掉。

        **空集合契约**：无匹配时 `data` 恒为 `[]`，绝不返回 `null`。
      parameters:
        - name: student_id
          in: query
          schema: { type: integer, format: int64 }
        - name: outcome
          in: query
          schema: { type: string, enum: [pending, converted, lost] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Trial' }
    post:
      tags: [trials]
      summary: "安排试听（R1：同学生同科目只能试听一次）"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrialRequest' }
      responses:
        '201':
          description: 已安排
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Trial' }
        '409':
          description: "R1 违反：code=40905"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /trials/{id}/outcome:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [trials]
      summary: "标记试听结果 → R2 自动生成 due_at = now + 48h 的跟进任务"
      description: |
        **R7 写校验**：这是写路径，事务内先按 `t.student_id` 回查归属，非本人学生即
        `403 / code=40301`（`service/trial.go` 复用 `StudentService.AssertOwner`，
        `service/student.go:18`）。此前这里漏了校验，等于任何 admin 都能把结果写进别人的试听。

        **状态推进**：`outcome=converted` 会把该学生的 `students.status` 从 `lead` / `trial`
        推进到 `active`（`UPDATE ... WHERE status IN ('lead','trial')` 作守卫：既不复活已
        `churned` 的，也不覆写已 `active` 的）；`outcome=lost` **完全不动** `students.status`
        —— 未转化的线索要留在顾问队列里继续挽回，置成 `churned` 等于自动放弃。
        生命周期见 `model/model.go:41`（`lead -> trial -> active -> churned`）。

        **审计**：同一事务内写一条 `audit_events`（`entity='trial'`、`action='outcome'`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [converted, lost] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      # 以运行时为准：`handler/trial.go:83` 直接 `OK(c, fu)`，`data` 就是新建的
                      # FollowUp 本身，**没有** `{ trial, follow_up }` 这层包装（旧草案写错了）。
                      # 前端曾按草案的包装写法做过防御（`LeadsPage.tsx:126-131` 两种都吃），
                      # 这里按实现校正，避免契约继续声明一个服务端从不返回的形状。
                      data: { $ref: '#/components/schemas/FollowUp' }
        '403':
          description: "R7 违反：code=40301 —— 该试听的学生不属于当前顾问"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '404': { $ref: '#/components/responses/NotFound' }

  /follow-ups:
    get:
      tags: [followups]
      summary: 跟进任务列表
      description: "**空集合契约**：无匹配时 `data` 恒为 `[]`，绝不返回 `null`。"
      parameters:
        - name: status
