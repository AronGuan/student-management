        **空集合契约**：无匹配时 `data.items` 恒为 `[]`，**绝不返回 `null`**。

        **服务端分页**：`page` / `limit` 生效，`limit` 上限 200，越界回落 20（见
        `components/parameters/Limit`）。`total` 与 `items` 出自同一组谓词。
        `status` 的 `overdue` 在读取时由 `due_at < now` 派生，不存库，所以跨过截止时间即刻为真。
      parameters:
