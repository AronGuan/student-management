                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        default: []
                        items: { $ref: '#/components/schemas/Class' }
        '400':
          description: "数字型 query 参数无法解析：code=40000，例如 \"weekday 必须是数字\""
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
    post:
      tags: [classes]
      summary: 建班（含老师时段冲突校验）
      requestBody:
        required: true
