                        items: { $ref: '#/components/schemas/TeacherOption' }
        '403':
          description: "code=40300：非 admin"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /lessons:
    get:
      tags: [lessons]
      summary: 课次列表
      description: "**空集合契约**：无匹配时 `data` 恒为 `[]`，绝不返回 `null`。"
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: teacher_id
          in: query
          schema: { type: integer, format: int64 }
        - name: class_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        default: []
                        items: { $ref: '#/components/schemas/Lesson' }
        '400':
          description: "数字型 query 参数无法解析：code=40000，例如 \"teacher_id 必须是数字\""
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /lessons/generate:
    post:
      tags: [lessons]
      summary: 按班级周计划批量生成课次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_date, to_date]
              properties:
                from_date: { type: string, format: date }
                to_date: { type: string, format: date }
                class_ids:
                  type: array
                  items: { type: integer, format: int64 }
                  description: 省略则生成全部 active 班级
      responses:
        '201':
          description: 已生成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          created: { type: integer }

  /lessons/cancel-range:
    post:
      tags: [lessons]
      summary: "老师请假：批量取消某老师一段时间的课（追问：老师请假一周）。不生成 attendance、不扣课时"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacher_id, from_date, to_date, reason]
              properties:
                teacher_id: { type: integer, format: int64 }
                from_date: { type: string, format: date }
                to_date: { type: string, format: date }
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          cancelled: { type: integer }
                          skipped_completed: { type: integer, description: "已完成的课不可取消，计入此项" }
        '403':
          description: "仅 admin 或该老师本人"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /lessons/{id}/roster:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [lessons]
      summary: "老师视角名单：学生 + 系统预填出勤状态 + 是否新生"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Roster' }

  /lessons/{id}/attendance:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [lessons]
      summary: "批量结算出勤并扣课时（R4 + R5）。幂等：同一学生同一课次只产生一条 consume 流水"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marks]
              properties:
                marks:
                  type: array
                  items: { $ref: '#/components/schemas/AttendanceRecordInput' }
                  description: |
                    字段名是 `marks`，**不是** `records` —— 本文档此前写错了，实现与前端一直是
                    `marks`（`handler/scheduling.go:359` 的 `json:"marks"`、`Roster.tsx` 的
                    `api.post(..., { marks })`）。契约是给对面用的说明书，写成一个双方都不发的
                    键名比不写更糟：照着文档写出来的客户端会得到 400，而文档看起来没问题。
      responses:
        '200':
          description: 已结算
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          charged:
                            type: integer
                            description: |
                              本次**实际**扣减的课时总数（`handler/scheduling.go:371` 的
                              `gin.H{"charged": charged}`）。此前文档写的是 `deducted` —— 同样
                              是照着文档写客户端就会读空的漂移，已按运行时校正。
                              幂等重放时这一行是**本次新增**的扣减数，不是这节课的总数：第二次
                              提交同一批学生全部命中 `continue`，因此返回 `0`，而不是把已经扣过的
                              课时再报一遍。前端据此提示的文案因此要读「本次扣 N」，不能读「本班扣 N」。
        '409':
          description: "code=40906 重复结算（幂等命中）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '422':
          description: "code=42201 出勤状态非法（老师只能覆盖为 present/absent）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /lessons/{id}/attendance/{student_id}:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
      - name: student_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [lessons]
      summary: "老师覆盖单条出勤（只能 present / absent，覆盖写 ledger 留痕）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [present, absent] }
                note: { type: string, maxLength: 255 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Attendance' }
        '422':
          description: "code=42201"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /leave-requests:
    get:
      tags: [leave]
      summary: 请假列表
      description: "**空集合契约**：无匹配时 `data` 恒为 `[]`，绝不返回 `null`。"
      parameters:
        - name: student_id
          in: query
          schema: { type: integer, format: int64 }
        - name: lesson_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        default: []
                        items: { $ref: '#/components/schemas/LeaveRequest' }
        '400':
          description: "数字型 query 参数无法解析：code=40000，例如 \"student_id 必须是数字\""
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
    post:
      tags: [leave]
      summary: "学生端发起请假。服务端按 (lesson.start - now) >= 24h 判 leave_approved（不扣）或 leave_late（照扣）"
      description: |
        服务端强制校验（R3 家族）：调用者必须是该 lesson 所属班级中 `status='active'` 报名记录对应的学生
        （household 只能对本家孩子的在册课次请假）。**不满足则 409 / code=40907。**
        这条校验是必需的：此前只校验学生归属，任何调用者都能对任意 lesson_id 请假，
        晚于 24h 的路径会真的扣 1 个课时——是数据完整性问题，不只是越权。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lesson_id]
              properties:
                lesson_id: { type: integer, format: int64 }
                reason: { type: string, maxLength: 255 }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveRequest' }
        '409':
          description: "code=40907：该学生未报名这节课所属的班级"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /ai/trial-conversion/{student_id}:
    parameters: [{ $ref: '#/components/parameters/PathIdStudent' }]
    post:
      tags: [ai]
      summary: "试听转化决策卡（R8：枚举白名单校验 + 失败降级 unavailable）"
      responses:
        '200':
          description: "HTTP 200 恒返回；LLM 不可用时 data.ai_status = unavailable 并附规则兜底结论"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiDecisionCard' }

  /ai/renewal-risk/{student_id}:
    parameters: [{ $ref: '#/components/parameters/PathIdStudent' }]
    post:
      tags: [ai]
      summary: 续费 / 流失决策卡
      responses:
        '200':
          description: "HTTP 200 恒返回"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiDecisionCard' }

  /students/{id}/ai-cards:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [ai]
      summary: 历史决策卡（含 ai_status）
      description: |
        路径参数是 **student id**，不是 card id —— 卡片按学生归属（handler/ai.go:22）。
        **仅 staff（admin / teacher）可读**，路由级 `RequireRoles` 拦截，household 一律 403（40300）。
        这点与 `/students/{id}` 有意不同：那里 household 可读自己的孩子，但被裁掉了
        `latest_ai_card`（见 `StudentDetail`）。决策卡是机构对家庭的商业判断 —— `churn_risk`、
        顾问建议的动作，以及会**逐字引用老师内部备注**的 `evidence` —— 若本端点仍对 household
        开放，那份裁剪就等于没做：同一个对象从第二个门原样递了出去。
        `AssertReadable`（ai.go:70）保留在 handler 内，对 staff 继续生效。
        响应形态是 `data: {items: [...]}` —— **不是裸数组**，与 `OK(c, gin.H{"items": ...})`
        （ai.go:79）一致。`items` 恒为数组，无卡片时是 `[]` 而不是 null。
      parameters:
        - name: kind
          in: query
          description: 按卡片类型过滤；不传则返回全部类型
          schema: { type: string, enum: [trial_conversion, renewal_risk] }
        - name: limit
          in: query
          description: 返回条数上限，默认 50；非数字时按默认值处理（此端点不做 400，见 ai.go:74 的 atoiOr）
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: |
            OK。注意：模型调用失败**不是**错误响应 —— 仍返回 200，
            由 `ai_status` 标明状态，卡片内容来自规则兜底引擎（ADR-006）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            default: []
                            items: { $ref: '#/components/schemas/AiDecisionCard' }
        '403':
          description: "code=40300：household 一律不可读（此端点 staff-only，路由级 RequireRoles）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dashboard/admin:
    get:
      tags: [dashboard]
      summary: "admin 首屏：五条行动队列 + 头部计数（不是学生列表）"
      description: |
        设计意图（见 `handler/dashboard.go:68-72`）：admin 的失效模式是**忘了动手**，不是找不到人。
        所以首屏是"现在该做什么"的行动队列，而不是一张需要自己拼凑的学生表。
        作用域：全部按 `s.owner_admin_id = 当前 admin` 收敛，只含自己的学生。
        `overdue_hours` / `due_at` 由 SQL **按服务端时钟**算出：服务端只下发逾期**小时数**，
        措辞（「2 天」/「6 小时」）由前端负责。前端**不得**自行由时间戳重新推导 SLA 数值，
        否则会在另一个时区渲染出错误的逾期时长。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminDashboard' }

  /dashboard/teacher:
    get:
      tags: [dashboard]
      summary: "老师首屏：今日课表 + 待补点名（富行，不点进去就能回答三个问题）"
      description: |
        设计意图（见 `handler/dashboard.go:204-205`）：老师不打任何东西就能回答
        「下一节是什么 / 谁是新面孔 / 谁请假了」。因此每行自带 `students` / `new_faces` /
        `on_leave` / `recorded` 四个计数，而不是让前端为每节课再发一次请求（N+1）。
        `start_clock` 由服务端从 `start_min` 格式化，前端不重复实现分钟到时钟的换算。
        `missing_roll_call`：过去日期里仍未点名的课次数 —— 这是老师端最容易积压的一类遗漏。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TeacherDashboard' }

  /dashboard/household:
    get:
      tags: [dashboard]
      summary: "家长/学生首屏：本家庭凭证名下的孩子及各自余额"
      description: |
        设计意图（见 `handler/dashboard.go:237-239`）：家长端存在的唯一理由是回答
        「我的课时怎么没了」。所以首屏第一屏就给出每个孩子的当前余额与在读状态，
        再由此进入逐条流水的 `/students/{id}/credits`。
        作用域：仅 `students.user_id = 当前登录用户`，一个家庭凭证可带多个孩子（兄弟姐妹）。
        响应形态是 `data: {students: [...]}` —— **不是裸数组**，与
        `OK(c, gin.H{"students": ...})`（dashboard.go:255）一致；`students` 恒为数组，
        无绑定时为 `[]` 而非 null。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          students:
                            type: array
                            default: []
                            items: { $ref: '#/components/schemas/HouseholdStudentRow' }
        '403':
          description: "code=40300：非 household 角色（仅 role=student 可访问）"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ae_token
      description: httpOnly Cookie，SameSite=Lax，生产加 Secure
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "供 curl / Postman 绕过前端直接测试规则时使用"

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PathIdStudent:
      name: student_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: |
        每页条数。有效区间 **1..200**；**越界（0、负数、>200）或无法解析时回落 20**，不报错
        （依据 `internal/service/student.go:85-87`；`page` 同理回落 1）。
        回落到 20 而非 400：分页参数只决定"取多少"，不改变**作用域**，服务端仍返回正确可见范围内的数据，
        故不适用 400 策略（见 ADR-010「契约不变量」的 400 适用边界）。
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }

  responses:
    OkEmpty:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    OkStudent:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Student' }
    Unauthorized:
      description: "code=40100"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    NotFound:
      description: "code=40400"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorBody' }

  schemas:
    ApiResponse:
      type: object
      required: [code]
      properties:
        code:
          type: integer
          description: "0=成功；非 0 见错误码表"
          example: 0
        data: {}
        message:
          type: string
          description: 错误时的人类可读描述

    ApiErrorBody:
      type: object
      properties:
        code: { $ref: '#/components/schemas/BusinessErrorCode' }
        message: { type: string, example: "周时段重叠：该学生周一 09:00-10:30 已在「数学 A 班」" }
        data:
          type: object
          nullable: true

    BusinessErrorCode:
      type: integer
      description: "业务错误码。0=成功；LLM 不可用走 200 + ai_status=unavailable，不属于错误码范畴"
      enum:
        - 40000
        - 40100
        - 40300
        - 40301
        - 40400
        - 40901
        - 40902
        - 40903
        - 40904
        - 40905
        - 40906
        - 40907
        - 40908
        - 42201
        - 42202
        - 50000
      example: 40901

    PageMeta:
      type: object
      description: |
        分页信封。**字段名是 `has_more`（下划线），不是 `hasMore`。**
        来源：`handler.Page` 的 json tag 为 `json:"has_more"`（respond.go:53）。
        前端曾按 `hasMore` 读取，得到恒为 `undefined`（falsy 而非异常），
        "下一页" 控件永久禁用且无任何报错 —— 静默失效正是拼写必须锁死的原因。
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        has_more:
          type: boolean
          description: 是否还有下一页。由 total / page / limit 计算，客户端不要自行推算

    UserRole:
      type: string
      enum: [admin, teacher, student]

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        role: { $ref: '#/components/schemas/UserRole' }
        username: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }

    StudentStatus:
      type: string
      enum: [lead, trial, active, churned]

    Guardian:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        relationship: { type: string, example: "mother" }
        is_primary: { type: boolean }

    Student:
      type: object
      description: |
        以 `model.Student`（model/model.go:51-68）的实际 json tag 为准。
        `balance` 与 `can_write` 是**派生只读字段**（`gorm:"->;-:migration"`，见 R5 / R7），
        不是表列，但**列表与详情都会返回**（它们挂在共享的 Student 结构上）。
      properties:
        id: { type: integer, format: int64 }
        owner_admin_id:
          type: integer
          format: int64
          nullable: true
          description: "归属顾问。Go 侧是 *uint64，学生可以不归属任何人，所以真的会是 null"
        user_id:
          type: integer
          format: int64
          nullable: true
          description: "家庭账号（家长与学生共用凭证）；一个账号可挂多个学生"
        full_name: { type: string }
        preferred_name: { type: string }
        year_level:
          type: string
          description: |
            **是字符串不是数字**（model/model.go:57 为 `string`），值为 "Year 9" / "Year 10"
            这类标签。此前契约误写为 integer，会把 "Year 9" 判成类型错误。
            空值是 `""`（无 omitempty）—— 消费侧用 `||` 兜底。
        status: { $ref: '#/components/schemas/StudentStatus' }
        source:
          type: string
          description: "获客来源。无 omitempty，未填时是 `\"\"` 而不是 null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        balance:
          type: integer
          description: "SUM(credit_ledger.delta)。派生，绝不存字段（R5）"
        can_write:
          type: boolean
          description: |
            调用者能否写这个学生 —— 由服务端算好（model.CanWrite，R7），
            客户端**不要**自行按 role 推断，否则和 R7 的判定逻辑会分叉。
            列表与详情都带此字段。

    StudentListItem:
      allOf:
        - $ref: '#/components/schemas/Student'
        - type: object
          properties:
            balance: { type: integer, description: "SUM(credit_ledger.delta)" }
            owner_admin_name: { type: string }
            active_class_count: { type: integer }
            pending_followup: { type: boolean }

    StudentDetail:
      allOf:
        - $ref: '#/components/schemas/Student'
        - type: object
          description: |
            注意：**同一份 schema 对两类凭据返回两种可见范围。** 员工（admin / teacher）拿到完整字段；
            household 凭据虽然可以读自己孩子的记录，但服务端在 `handler/student.go` 的 `Get` 里
            按角色把**内部那一半**置空后才下发 —— `recent_feedback` 与 `follow_ups` 返回 `[]`，
            `latest_ai_card` 返回 `null`。留下的 `parent_updates` 才是真正给家庭的那一份。
            之所以在服务端裁而不是靠前端不渲染，是因为**不渲染不是边界**：拿到 token 的人可以直接读 JSON。
            裁剪范围只限「同事之间的原话」和「机构自己的推理」；`guardians` / `packages` /
            `enrollments` / `balance` / `owner_admin_id` 家长本来就该看到，不做裁剪。
          properties:
            balance: { type: integer }
            guardians:
              type: array
              items: { $ref: '#/components/schemas/Guardian' }
            enrollments:
              type: array
              items: { $ref: '#/components/schemas/Enrollment' }
            packages:
              type: array
              items: { $ref: '#/components/schemas/CreditPackage' }
            follow_ups:
              type: array
              description: |
                同一个学生的跟进记录（`service.FollowUpRow`，`student_detail.go:66-85`），按
                `created_at` 倒序。与 `recent_feedback` / `parent_updates` 是三份**并排的数据**：
                这一支是顾问自己那一半（他打算怎么处理、处理到哪一步）。
                也受角色裁剪：家庭凭据恒得到 `[]`（见上方 description）。

                items 指向 `StudentFollowUpRow` 而**不是** `FollowUp`。抽屉的投影比那份 schema 窄，
                **这是设计不是遗漏** —— 详见新 schema 的说明。此前的指向是错的：它声明了一个
                这个端点从不发出的形状。
              items: { $ref: '#/components/schemas/StudentFollowUpRow' }
            recent_feedback:
              type: array
              description: |
                老师本人写下的课堂评价，**按 `recorded_at` 倒序，最多 10 条**。
                它取的是 `attendances.note`，但只返回**人写的部分**：服务端用
                `service.teacherFeedback()` 把两处系统样板剥掉后才下发 —— 迟到请假时
                系统写的 `late leave: notice < 24h`，以及考勤纠错时追加的
                `corrected from <旧状态>` 后缀（纠错会把它接在老师原话之后，也可能
                独自落在列里）。被剥离后为空的行**整行丢弃**，所以返回条数可能不足 10
                —— 这是有意的：十行样板不如三行老师真写过的话。同一列也被 AI 续费卡
                读取，两侧共用同一套清洗规则，不会出现两种读法。
              items: { $ref: '#/components/schemas/FeedbackRow' }
            parent_updates:
              type: array
              description: |
                顾问写给这个家庭、家长在 `/me` 上真能读到的那句话，**按 `parent_note_at` 倒序、最多 10 条**。
                与 `recent_feedback` 是两份不同的数据，不是一份数据的两个视图：那一份出自点名页备注列，
                是老师写给同事的课堂记录；这一份出自 `follow_ups.parent_note`，是顾问处理完一次跟进后
                亲手写给家长的话。两者之间**没有派生关系** —— 不做自动脱敏、不做自动摘要，因为
                「忘了跟家长说」（行存在但 `parent_note` 为 NULL）和「没什么可跟家长说」（行不存在）
                必须能区分开。服务端只下发 `parent_note` 非空的行，所以这里**必然非空**；
                没有可展示内容时是空数组 `[]`，不是 `null`（与其他集合同一口径）。
              items: { $ref: '#/components/schemas/ParentUpdateRow' }
            latest_ai_card:
              allOf:
                - $ref: '#/components/schemas/AiDecisionCard'
              nullable: true

    FeedbackRow:
      type: object
      description: |
        一条老师课堂评价，连同它所属的课次。`note` 是**已清洗过的**老师原话
        （见 `StudentDetail.recent_feedback`）：系统生成的 `late leave:` /
        `corrected from` 文本不会出现在这里。字段恒在。
      properties:
        id: { type: integer, format: int64, description: "attendances.id" }
        lesson_date: { type: string, example: "2026-09-16", description: "lessons.lesson_date，YYYY-MM-DD" }
        class_name: { type: string }
        subject_name: { type: string, description: "无科目时为空串，非 null" }
        teacher_name: { type: string, description: "users.display_name；无老师时为空串，非 null" }
        status:
          type: string
          enum: [present, late, absent, leave_approved, leave_late]
          description: "该次考勤的状态。写备注的行通常是 present/late，但枚举保留完整取值"
        note: { type: string, description: "老师原话，已剥掉系统文本" }
        recorded_at: { type: string, format: date-time }

    ParentUpdateRow:
      type: object
      description: |
        一条**给家长的告知**，连同说话的人。取 `follow_ups.parent_note`，不是 `attendances.note`：
        同一个事件的两面 —— 老师那面是 `recent_feedback`（内部），顾问这面是这里（对客户的正式陈述）。
        `note` **恒非空**（服务端已按 `parent_note IS NOT NULL AND parent_note <> ''` 过滤），
        `speaker_name` 可能为空串（`parent_note_by_user_id` 指向的用户被删或为空时），
        所以客户端回退要用 `|| '课程顾问'`，**不能用 `??`** —— `??` 兜不住空串。
        四个字段恒在，没有 omitempty。
      properties:
        id: { type: integer, format: int64, description: "follow_ups.id" }
        note: { type: string, description: "顾问写给家长的原话，服务端保证非空" }
        speaker_name: { type: string, description: "users.display_name；可能为空串，非 null" }
        recorded_at: { type: string, format: date-time, description: "follow_ups.parent_note_at，排序依据" }

    CreateStudentRequest:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string, maxLength: 120 }
        preferred_name: { type: string, maxLength: 60 }
        year_level: { type: integer, minimum: 0, maximum: 12 }
        source: { type: string, maxLength: 60 }
        status: { $ref: '#/components/schemas/StudentStatus' }
        guardians:
          type: array
          items: { $ref: '#/components/schemas/Guardian' }
        create_family_account:
          type: boolean
          description: "true 时同时创建 role=student 的家庭账号并返回初始口令"

    UpdateStudentRequest:
      type: object
      properties:
        full_name: { type: string, maxLength: 120 }
        preferred_name: { type: string, maxLength: 60 }
        year_level: { type: integer, minimum: 0, maximum: 12 }
        status: { $ref: '#/components/schemas/StudentStatus' }
        source: { type: string, maxLength: 60 }

    CreditPackage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        name: { type: string }
        total_credits: { type: integer }
        price_cents: { type: integer }
        purchased_at: { type: string, format: date-time }
        purchased_by_admin_id: { type: integer, format: int64 }
        status: { type: string, enum: [active, void, refunded] }

    CreatePackageRequest:
      type: object
      required: [name, total_credits, price_cents]
      properties:
        name: { type: string, maxLength: 120 }
        total_credits: { type: integer, minimum: 1, maximum: 999 }
        price_cents: { type: integer, minimum: 0 }

    LedgerEntry:
      type: object
      description: "只增不改。无 updated_at 字段"
      properties:
        id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        package_id: { type: integer, format: int64, nullable: true }
        delta: { type: integer, description: "正=进，负=出" }
        reason:
          type: string
          enum: [purchase, consume, leave_adjust, manual_adjust, refund, transfer_out]
        lesson_id: { type: integer, format: int64, nullable: true }
        attendance_id: { type: integer, format: int64, nullable: true }
        actor_user_id: { type: integer, format: int64 }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Trial:
      type: object
      description: |
        `model.Trial`（model.go:244-259）。**它同时被两个端点引用，而两个端点返回的键集并不相同**：
        `GET /trials` 的 `items[]`（openapi.yaml:553）与 `POST /trials` 的 `data`（openapi.yaml:577）。

        列表的 SELECT 是 `handler/trial.go:107-112`：
        `SELECT t.*, s.full_name AS student_name, sub.name AS subject_name, u.display_name AS teacher_name`
        加一个 `JOIN students` 与两个 `LEFT JOIN`。所以 `student_name` 在列表里**恒在**（学生表是
        INNER JOIN）；`subject_name` / `teacher_name` 来自 LEFT JOIN，取不到时与 `teacher_id`、
        `outcome_note` 一样落在零值 ⇒ 带 `omitempty`，**整个键缺席**。而 `POST /trials` 返回的是
        JSON 绑定出来的 `model.Trial`（`handler/trial.go:135`），三个联表派生字段**整键缺席** ——
        它们不是列，插入之后没有联表可填。

        所以本 schema 描述的是**并集**，逐字段注明由哪个端点填充，而不是假装每个端点都返回全部键。
        这层差异**刻意不拆成第二个 schema**：`subject_name` 早就在本 schema 里，而 `POST /trials`
        同样不填它，要拆就得连它一起搬走，改动远大于这个缺口本身。把取舍写在这里，是为了让下一个
        人不必重新判断一次。

        **反序列化口径**：带 `omitempty` 的字段在 Go 零值时**整个键缺席**，不是 `null` —— 因此这些
        字段**刻意不写 `nullable: true`**（理由同 `TrialRow` 与 `FollowUp`）：那会声明一个永远不会
        出现的 `null`，把客户端引去判空错误的对象；判空要写 `undefined`（`?? / == null` 两者都能兜住）。
      properties:
        id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        subject_id: { type: integer, format: int64 }
        subject_name:
          type: string
          description: 带 omitempty：无科目时键缺席（undefined），不是 null。只有 `GET /trials` 会填它
        teacher_id: { type: integer, format: int64, description: "omitempty 指针：无老师时键缺席（undefined），非 null" }
        scheduled_at: { type: string, format: date-time }
        duration_min: { type: integer }
        outcome: { type: string, enum: [pending, converted, lost] }
        outcome_note: { type: string, description: "omitempty：无备注时键缺席（undefined），非 null" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: "无 omitempty：恒在" }
        student_name:
          type: string
          description: |
            `GET /trials` 会填它，且在列表里**恒在**（`handler/trial.go:107` 取 `s.full_name`，
            学生表是 INNER JOIN）。`POST /trials` 不填它 ⇒ 那边键缺席（undefined），不是 null
            —— 字段本身带 `omitempty`。
        teacher_name:
          type: string
          description: 带 omitempty：无老师时键缺席（undefined），不是 null。只有 `GET /trials` 会填它

    CreateTrialRequest:
      type: object
      required: [student_id, subject_id, teacher_id, scheduled_at]
      properties:
        student_id: { type: integer, format: int64 }
        subject_id: { type: integer, format: int64 }
        teacher_id: { type: integer, format: int64, description: "服务端强制必填（`service/trial.go` 的 CreateTrial 连同 student_id / subject_id 一起校验）。缺少它或传 0 即 400 / code=40000：没有老师的试听无法出勤结算，且 `GET /trials` 按 trials.teacher_id = self 收口，这样的行对所有老师都不可见。" }
        scheduled_at: { type: string, format: date-time }
        duration_min: { type: integer, default: 60 }

    FollowUp:
      type: object
      description: |
        `model.FollowUp`（model.go:265-286），被三处复用：`/follow-ups` 列表、
        `/students/{id}` 的 `follow_ups[]`、`POST /trials/{id}/outcome` 的 `data`。
        **反序列化口径**：带 `omitempty` 的字段在 Go 零值时**整个键缺席**，不是 `null` ——
        因此这些字段**刻意不写 `nullable: true`**（理由同 `TrialRow`）：那会声明一个永不出现的
        `null`，把客户端引去判空错误的对象；判空要写 `undefined`（`?? / == null` 两者都能兜住）。
        `due_at` / `status` / `created_at` 无 `omitempty`，**恒在**。
      properties:
        id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        student_name: { type: string, description: "omitempty：无值时键缺席（undefined），非 null" }
        trial_id: { type: integer, format: int64, description: "omitempty 指针：为 NULL 时键缺席（undefined），非 null" }
        source:
          type: string
          enum: [trial, teacher_note]
          description: |
            这条跟进**为什么存在**。由**创建它的那条路径显式写下**，不由 `trial_id` 是否为空
            推出来 —— 不让读的人去推断「`trial_id` 缺席 ⇒ 课堂来的」，是因为那是一个
            「有符号、无守卫」的约定：第三种来源出现时它会静默失效，而没有任何约束、索引或
            测试会报错，只是从某一天起所有新行都被读成课堂来的。列上是一个 ENUM，写错值写不进去。

            `trial` = 记录试听结果时自动开的 48h 跟进（R2）；
            `teacher_note` = 老师在点名页勾了「需要顾问跟进」（见 `AttendanceRecordInput.needs_follow_up`）。

            无 omitempty，恒在：列是 `NOT NULL DEFAULT 'trial'`，迁移把 `000004` 之前的所有行
            回填成 `trial` —— 那些行确实全部出自试听路径，所以这个默认值不是将就，是当时的事实。
            两个来源按本字段**恰好切分**「未完成的跟进」：`/dashboard/admin` 的
            `overdue_follow_ups` 只看 `trial`，`flagged_follow_ups` 只看 `teacher_note`，
            合起来不重不漏。
        due_at: { type: string, format: date-time, description: "两条路径都写入 now + FOLLOWUP_SLA_HOURS（R2 与课堂标记共用同一个阈值来源 config.Thresholds.FollowUpSLAHours，不各自硬编码 48）；无 omitempty，恒在" }
        status: { type: string, enum: [pending, done, overdue] }
        completed_at: { type: string, format: date-time, description: "omitempty 指针：未完成时键缺席（undefined），非 null" }
        completed_by_user_id: { type: integer, format: int64, description: "omitempty 指针：未完成时键缺席（undefined），非 null" }
        note: { type: string, description: "omitempty：无备注时键缺席（undefined），非 null" }
        created_at: { type: string, format: date-time, description: "无 omitempty：恒在" }
        overdue_hours:
          type: integer
          format: int64
          description: |
            服务端**按服务端时钟**算出的逾期小时数，措辞由前端负责（`GET /dashboard/admin` 的
            `FollowUpRow.overdue_hours` 同一口径）。三点必须记住：

            1. **只有「仍是 pending 且已过 `due_at`」的行才有值**
               （`service/trial.go:141-165`：`status == "pending" && due_at < now`）。
               `model.FollowUp` 是 `*int64` + `omitempty`，其余所有行**整个键缺席** —— 要判的是
               `undefined`，**不是 `null`**，故本字段**不写 `nullable: true`**（理由同 `TrialRow`）。
            2. **键在 ⟺ 已逾期**：有值即已逾期，且**永不为负**，取值域 `[0, +∞)`；`0` 表示
               「已逾期但不足 1 小时」，不是「未到期」。这与 `/dashboard/admin` 的
               `FollowUpRow.overdue_hours` 完全一致，前端一个 `overdueLabel()` 就能同时读对，
               **不需要按端点分支**。之所以不采用「负值 = 距到期还有多少小时」的有符号约定：
               一是字段名为 `overdue_hours`，负值自相矛盾；二是那会把本字段的值域放宽到
               `(-∞, +∞)`，比同名孪生字段文档化的 `[0, +∞)` 更宽。**同名同义，否则就不是同一个字段。**
               （`service/trial.go` 用的是 `now.Sub(due_at)`；写成 `due_at.Sub(now)` 会整体反号，
               于是每一条逾期行都会被前端读成「未到期」，而每一条未来行反被读成「已逾期」。）
            3. 三档过滤下的表现：`?status=pending` 选出的是 `due_at >= now` 的**未来**行，本键
               **恒缺席**；`?status=overdue` 选出的必然已逾期，本键**恒为正值**；不带 `status`
               的混合队列则**只**给已逾期的行带上正值，未到期与已完成的行都不带。前端对没有本键
               的行自行回落到本地 SLA 倒计时，**服务端不替它兜底** —— 这正是本次移除英文串
               （旧 `overdue_by`，如 `"12h overdue"`）的原因。

    Class:
      type: object
      description: |
        形状依据 `model.Class`（model.go:85-102）与 `GET /classes` 的查询（scheduling.go:60-66）。
        注意 `enrolled` / `subject_name` / `teacher_name` 是查询期计算列，带 `omitempty`，
        因此**可能缺席**而非为 0；客户端把它们当可选字段处理。
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        subject_id: { type: integer, format: int64 }
        subject_name: { type: string, description: "LEFT JOIN 计算列，`omitempty`" }
        teacher_id: { type: integer, format: int64 }
        teacher_name: { type: string, description: "LEFT JOIN 计算列，`omitempty`" }
        weekday: { type: integer, minimum: 0, maximum: 6, description: "0=周日 .. 6=周六" }
        start_min: { type: integer, description: "自 00:00 起的分钟数（墨尔本墙上时间）" }
        end_min: { type: integer }
        capacity: { type: integer, description: "容量上限；是否满员用 `enrolled >= capacity` 判断" }
        room: { type: string, description: "可空字符串，`omitempty`" }
        status: { type: string, enum: [active, archived] }
        enrolled:
          type: integer
          description: "当前 `status='active'` 的报名人数（子查询计算列，`omitempty`）。剩余座位 = `capacity - enrolled`"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateClassRequest:
      type: object
      required: [name, subject_id, teacher_id, weekday, start_min, end_min, capacity]
      properties:
        name: { type: string, maxLength: 120 }
        subject_id: { type: integer, format: int64 }
        teacher_id: { type: integer, format: int64 }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        start_min: { type: integer, minimum: 0, maximum: 1439 }
        end_min: { type: integer, minimum: 1, maximum: 1440 }
        capacity: { type: integer, minimum: 1, maximum: 100 }
        room: { type: string, maxLength: 40 }

    Enrollment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        class_id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        student_name: { type: string }
        weekday: { type: integer, description: "自 classes 冗余，用于 uq_student_slot 唯一约束" }
        start_min: { type: integer }
        status: { type: string, enum: [active, withdrawn] }
        enrolled_on: { type: string, format: date }
        withdrawn_on: { type: string, format: date, nullable: true }

    Lesson:
      type: object
      properties:
        id: { type: integer, format: int64 }
        class_id: { type: integer, format: int64 }
        class_name: { type: string }
        teacher_id: { type: integer, format: int64 }
        lesson_date: { type: string, format: date }
        weekday: { type: integer }
        start_min: { type: integer }
        end_min: { type: integer }
        status: { type: string, enum: [scheduled, cancelled, completed] }
        cancel_reason: { type: string, nullable: true }

    RosterEntry:
      type: object
      properties:
        student_id: { type: integer, format: int64 }
        student_name: { type: string }
        is_new_to_class: { type: boolean }
        prefilled_status:
          type: string
          enum: [present, absent, leave_approved, leave_late]
          nullable: true
          description: "系统预填：有 leave_request 时按 24h 阈值预填 leave_approved / leave_late"
        current_status:
          type: string
          enum: [present, late, absent, leave_approved, leave_late]
          nullable: true
        source:
          type: string
          enum: [prefilled, teacher_override, system]
          nullable: true
        balance: { type: integer }
        note:
          type: string
          nullable: true
          maxLength: 255
          description: "老师填的自由备注（attendances.note）。未点名时为 null；纠错会以 ' | corrected from <旧状态>' 追加在原备注之后，故读到的值可能长于老师当初输入的内容"

    Roster:
      type: object
      properties:
        lesson: { $ref: '#/components/schemas/Lesson' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/RosterEntry' }

    Attendance:
      type: object
      properties:
        id: { type: integer, format: int64 }
        lesson_id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        status: { type: string, enum: [present, late, absent, leave_approved, leave_late] }
        source: { type: string, enum: [prefilled, teacher_override, system] }
        recorded_by_user_id: { type: integer, format: int64, nullable: true }
        recorded_at: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }

    AttendanceRecordInput:
      type: object
      required: [student_id, status]
      properties:
        student_id: { type: integer, format: int64 }
        status:
          type: string
          enum: [present, late, absent]
          description: "老师只能提交这三种；leave_approved / leave_late 由系统按 24h 阈值预填并只读"
        note: { type: string, maxLength: 255 }
        needs_follow_up:
          type: boolean
          default: false
          description: |
            「需要顾问跟进」—— 老师在这一行上打的勾，不是一个输入框。

            为什么不给老师第二段话：这一列只有**一支笔**，写的人是在课堂上的老师；
            家长读到的那段话由顾问消化后另行写下（`follow_ups.parent_note`），两者互不派生
            （见 `POST /follow-ups/{id}/complete`）。老师的职责只是把「这件事需要有人接手」
            推出去，所以这里要的是一个**动作**而不是一段文字。

            服务端在同一次结算事务里为这一行插一条 `follow_ups`：
            `source='teacher_note'`、`trial_id=NULL`、`due_at = now + FOLLOWUP_SLA_HOURS`、
            `status='pending'`、`note=NULL`（`note` 是顾问完成时写的处理说明，不是老师的原话；
            老师的原话已经在 `attendances.note` 里，抄第二份只会让两处各自漂移）。

            两条必须成立的不变量：
            1. **只有本次真正新建出出勤行的那一行才会开跟进。** 重放同一次结算时整行被幂等
               跳过（`Settle` 的 `existingID != 0 → continue` 分支），跟进也不会重复生成 ——
               勾两次不会得到两条待办。
            2. `needs_follow_up` **不构成为什么这一行会被拒绝**。状态本身不合法（请假两态、
               或任何非 present/late/absent）仍然照 R4 以 422 拒绝整次请求，与这个键无关。
            3. **这个勾只能撤回一个请求，撤不回一件事实。** 提交之后备注列转只读（纠错走 PATCH，
               而 PATCH 不接受 `needs_follow_up`），所以老师把勾取消掉**不会**撤销已经开出的那条待办。
               这是有意的：`follow_ups` 是顾问名下的一张工单，一旦存在就有了自己的生命周期
               —— 顾问可能已经把电话打完了。老师撤回请求、与顾问关掉工单，是两件事；
               后者走 `POST /follow-ups/{id}/complete`（关闭，不是删除）。
            4. **非空 `note` 不是服务端不变量，是客户端的一条规则。** 界面上旗标只在那一行
               真的写了课堂记录时才出现（没有内容就没有要接手的东西）；但服务端**不**因为它为空
               而拒绝。值得记录的事实只有「老师标记了这一行」，把它当成错误会让一个本来能落库的
               事实变成一个 400 —— 而一个 400 不会让老师补写那句话，只会让这次点名白点。

    LeaveRequest:
      type: object
      properties:
        id: { type: integer, format: int64 }
        lesson_id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        requested_by_user_id: { type: integer, format: int64 }
        requested_at: { type: string, format: date-time }
        reason: { type: string, nullable: true }
        resolution:
          type: string
          enum: [approved_ge_24h, late_lt_24h]
          description: "服务端按 (lesson.start - requested_at) >= 24h 判定"
        created_at: { type: string, format: date-time }

    AiDecisionCard:
      type: object
      properties:
        id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        kind: { type: string, enum: [trial_conversion, renewal_risk] }
        ai_status:
          type: string
          enum: [ok, invalid, unavailable]
          description: "invalid=输出未过白名单；unavailable=超时/失败，此时下列字段来自规则兜底引擎"
        headline: { type: string }
        recommendation: { type: string, description: "枚举白名单，服务端校验" }
        confidence: { type: string, enum: [low, medium, high] }
        reasons:
          type: array
          items: { type: string }
        suggested_actions:
          type: array
          items: { type: string }
        model: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ---- 配置与选项（形状依据 handler/ai.go:85-87、scheduling.go:87-114）----

    Thresholds:
      type: object
      description: |
        三个**假设值**的单一真源。前端读取后用于渲染文案，不得再本地硬编码一份。
        改动此处会同时改变服务端判定行为与 UI 文案。
      properties:
        followup_sla_hours:
          type: integer
          default: 48
          description: "R2：试听结束后多久内必须跟进，否则进逾期队列。env `FOLLOWUP_SLA_HOURS`"
        leave_notice_hours:
          type: integer
          default: 24
          description: "R4：提前多少小时请假才不扣课时（`>=` 该值判 `leave_approved`，否则 `leave_late` 照扣）。env `LEAVE_NOTICE_HOURS`"
        low_credit_threshold:
          type: integer
          default: 4
          description: "R6：余额 <= 该值进入低课时预警队列；余额为 0 时禁止排课。env `LOW_CREDIT_THRESHOLD`"

    SubjectOption:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    TeacherOption:
      type: object
      description: "仅 `status='active'` 的老师"
      properties:
        id: { type: integer, format: int64 }
        display_name: { type: string }
        username: { type: string }

    # ---- Dashboard（形状依据 handler/dashboard.go，见 ADR-011 逐项裁定）----

    AdminDashboard:
      type: object
      description: |
        五条行动队列是产品主张，五个计数是队列表达不了的头部数字。
        **注意 `today_lessons` 是整数计数，不是数组**（与首版规格的数组语义不同）——
        点开今日课表请走 `GET /lessons?date=...`。
        `upcoming_trials` 与 `awaiting_outcome_trials` 是同一条时间轴的两段，**互不重叠**：
        前者是「还没开始」（`scheduled_at >= now`），后者是「已经上完但结果没记」
        （`scheduled_at + COALESCE(duration_min,60) <= now` 且 `outcome='pending'`）。
        正在进行中的那一段（已开始、未结束）两边都不收 —— 那段时间顾问本来就无事可做，
        因为结果只有在课上完之后才谈得上。

        两条跟进队列按 `source` **恰好切分**「未完成的跟进」：`overdue_follow_ups` 只看 `trial`，
        `flagged_follow_ups` 只看 `teacher_note`，合起来不重不漏。

        两条跟进队列都**不下发已软删学生的行**（`s.deleted_at IS NULL`）：那些行上的
        「标记为已跟进」必然 404（`service/trial.go` 的 `CompleteFollowUp` 走 `AssertOwner`，
        它带 `deleted_at IS NULL`），把一个点不动的任务摆给顾问比不摆更糟 —— 这是本仓库
        反复写过的同一句判词。数组与它对应的计数**用同一个谓词**，否则页头说 5 条、列表画 3 条，
        而看的人只会以为列表漏了。
      properties:
        overdue_follow_ups:
          type: array
          default: []
          description: |
            逾期跟进队列（超过 48h SLA 未跟进），按 due_at 升序，上限 20（R2）。
            **只看 `source='trial'`** —— 课堂记录标记那条线由 `flagged_follow_ups` 承担，
            两个队列按 `source` 恰好切分「未完成的跟进」，不重不漏。之所以要显式切分而不是
            「反正现在逾期的都是试听来的」：那是靠数据现状成立的说法，不是靠约束成立的说法，
            课堂标记一旦逾期就会同时出现在两区里，而写这条 SQL 的人当时并不知道。
          items: { $ref: '#/components/schemas/FollowUpRow' }
        flagged_follow_ups:
          type: array
          default: []
          description: |
            「课堂记录标记」—— 老师在点名页勾了「需要顾问跟进」而顾问还没处理完的项，
            按 due_at 升序，上限 20。

            与 `overdue_follow_ups` 的三点不同，都是刻意的：
            1. **不按是否逾期过滤**（`status='pending' AND source='teacher_note'` 全部）。
               逾期的行**留在这里**而不是甩进逾期区：逾期区按 source 只收试听转化，而且它当前
               在界面上是隐藏的（用户裁定），甩过去等于让这一条任务凭空消失。
            2. **行里没有 `overdue_hours`**，见 `FlaggedFollowUpRow`。
            3. 展示的措辞由前端从 `due_at` 做本地倒计时，服务端不替它算差值。
          items: { $ref: '#/components/schemas/FlaggedFollowUpRow' }
        upcoming_trials:
          type: array
          default: []
          description: "未来待上/待反馈的试听（尚未开始），按 scheduled_at 升序，上限 10"
          items: { $ref: '#/components/schemas/TrialRow' }
        awaiting_outcome_trials:
          type: array
          default: []
          description: |
            已上完、但结果还没记录的试听：`outcome='pending'` 且
            `scheduled_at + COALESCE(duration_min,60) <= now`。按**结束时刻升序**
            —— 结束最久的排最前，上限 20。
            这些是全系统里唯一「顾问此刻就能操作」的试听：记录结果同时在同一事务里
            启动 48h 跟进时钟（R2）。
            排序方向与 `GET /trials?outcome=pending` **刻意相反**，两处不是笔误：
            那边是档位浏览，刚下课的最该马上打电话，所以最新的在前；这边是积压兜底，
            越久没记的行越该先救，所以最旧的在前。
          items: { $ref: '#/components/schemas/TrialRow' }
        low_credit:
          type: array
          default: []
          description: "低课时队列（余额 <= 阈值，R6），按余额升序，上限 20"
          items: { $ref: '#/components/schemas/LowCreditRow' }
        today_lessons:
          type: integer
          description: "今日与自己学生相关的课次**数量**（计数，非数组）"
        pending_followups: { type: integer, description: "待跟进总数（含未逾期）" }
        overdue_followups: { type: integer, description: "逾期跟进总数（`source='trial'`；与 overdue_follow_ups.size 可能不等：后者上限 20）" }
        flagged_followups:
          type: integer
          description: |
            「课堂记录标记」未处理总数（`source='teacher_note' AND status='pending'`，含已逾期；
            与 `flagged_follow_ups.size` 可能不等：后者上限 20）。计数与数组用同一个谓词，
            否则页头说 5 条、列表只画 3 条，而看的人只会以为列表漏了。
        low_credit_students: { type: integer, description: "低课时学生总数（与 low_credit.size 可能不等）" }
        awaiting_outcome_trials_count:
          type: integer
          description: |
            「已上完待记录」总数（与 `awaiting_outcome_trials.size` 可能不等：后者上限 20）。
            名字带 `_count` 后缀而没有照抄兄弟字段的省略式（`overdue_followups` /
            `low_credit_students`）：这一对的数组名与计数名无法靠「去掉下划线」区分，
            硬凑会得到两个含义刚好相反的键名，那比不一致更糟。

    FollowUpRow:
      type: object
      description: |
        逾期跟进行。`overdue_hours` 是 SQL 按服务端时钟算出的**逾期小时数**，措辞由前端负责。
        口径与 `GET /follow-ups` 列表里的 `FollowUp.overdue_hours` 一致：**两边都只写正数、
        永不为负**，键在即已逾期（见该 schema：那边靠指针 + `omitempty` 让未逾期行整个键缺席，
        这边靠队列预过滤，键恒在）。
        本队列**恒 >= 0**：SQL 是 `TIMESTAMPDIFF(HOUR, due_at, now)`（即 `now - due_at`）且
        已用 `due_at < now` 过滤；逾期不足 1 小时时截断为 `0`。
        **键恒在**（结构体是非指针 `int64` 且无 `omitempty`）：该队列已被 `due_at < now` 过滤，
        字段总有意义。`TIMESTAMPDIFF` 是**截断**的 —— 逾期不足 1 小时会诚实地得到 `0`
        而不是 `1`，前端对 `<= 0` 自行回落，服务端不替它兜底。
      properties:
        id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        student_name: { type: string }
        due_at: { type: string, format: date-time }
        overdue_hours: { type: integer, format: int64, example: 26 }

    FlaggedFollowUpRow:
      type: object
      description: |
        「课堂记录标记」队列的一行（`/dashboard/admin` 的 `flagged_follow_ups`）。

        与 `FollowUpRow` 只差一个字段，却是**必须分开的两个类型**，不是重复定义：
        `FollowUpRow.overdue_hours` 的文档明写「`0` 表示已逾期但不足 1 小时**而不是**未到期」。
        而本队列的行按定义**还没到期**（`due_at = 标记时刻 + 48h`），若复用同一个类型，服务端
        只能给出一个 `0` 或一个负数：前者与那句文档正面冲突（「没到期」被渲染成「已逾期 0 小时」），
        后者会把这个字段的值域从 `[0, +∞)` 放宽到 `(-∞, +∞)`，而它和 `FollowUp.overdue_hours`
        是**同名**的。所以这里干脆不带这个字段：前端拿 `due_at` 做本地倒计时，与服务端
        在 `GET /follow-ups` 上对未逾期行的处理方式完全一致。
      properties:
        id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        student_name: { type: string }
        due_at: { type: string, format: date-time }

    StudentFollowUpRow:
      type: object
      description: |
        学生抽屉里 `follow_ups[]` 的一行（`service.FollowUpRow`，`student_detail.go:66-85`）。

        它**不是** `FollowUp` 的别名，所以这里必须有自己的一份 schema。此前
        `StudentDetail.follow_ups.items` 直接指向 `FollowUp`，等于声明了两类这个端点从不发出的形状
        （`overdue_hours` 与 `parent_note*`），而契约里一个永不出现的字段比没有字段更糟：
        照着文档写出来的客户端会渲染一片空白，并且无法把它和「这个字段恰好没有值」区分开 ——
        这一点本仓库已经在 `lowCreditRow`（`handler/dashboard.go:56-60`）上付过一次学费。

        两处缺口各自都是有意的，不要去补齐：

        1. **没有 `overdue_hours`。** 抽屉从来没有算过 SLA 差值。要补上就得把
           `service/trial.go:204-227` 那段「只有仍是 pending 且已过 `due_at` 才赋值」的派生规则
           再实现一遍，于是同一套 SLA 有了第二个真相源 —— 而前端本来就有本地倒计时回落
           （`FollowUp.overdue_hours` 的第 3 条写了这套回落的约定），不需要服务端再给一份。
        2. **没有 `parent_note` / `parent_note_at` / `parent_note_by_user_id`。** 对外那段话在抽屉里是
           **另一个数组** `parent_updates`，从同一张表按 `parent_note IS NOT NULL` 取的。
           把同一句话也塞进这一行，屏幕上就会出现两遍，而这两遍会各自漂移。

        发现它比 `FollowUp` 少字段时，先问「这个端点的读者是不是真的需要它」，再决定加。
        `source` 是本轮加进来的唯一一个字段，理由就是这里的读取者第一次需要分辨两类来源。

        **空值口径与 `FollowUp` 不同，三处都不能混着判**（这个结构体用的是值类型而不是指针加
        `omitempty`）：`trial_id` / `completed_at` / `completed_by_user_id` 为 NULL 时发**显式的
        `null`**（`FollowUp` 那边是键整个缺席）；`note` 为 NULL 时发**空串 `""`**，既不是 `null`
        也不是键缺席。
      properties:
        id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        student_name: { type: string }
        trial_id:
          type: integer
          format: int64
          nullable: true
          description: "为 NULL 时发 `null`（`*uint64` 无 `omitempty`）。与 `FollowUp.trial_id` 的口径**相反**，那边是键缺席"
        source:
          type: string
          enum: [trial, teacher_note]
          description: |
            同 `FollowUp.source`。这一支是**显式列清单**挑出来的（`student_detail.go:185-190`），
            所以新增来源列时必须同时加到这里 —— 否则它不会报错、不会编译失败、测试也不会红，
            只会让这个端点的每一行少一个键。本轮已经因为同一原因修过一次。
        due_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, done, overdue] }
        completed_at: { type: string, format: date-time, nullable: true }
        completed_by_user_id: { type: integer, format: int64, nullable: true }
        note:
          type: string
          description: "顾问的处理说明。为 NULL 时发**空串**，不是 `null`（值类型，非指针）—— 与 `FollowUp.note` 的「键缺席」是两回事"

    TrialRow:
      type: object
      description: |
        仪表盘试听队列的一行，由 `handler/dashboard.go` 的 `trialRow` 产出。注意它是
        **专为本仪表盘写的 DTO，不是 `model.Trial`** —— 两者的字段集与 JSON 行为都不同，
        别互相照抄兜底代码。
        `subject_name` / `teacher_name` 在这里是**普通 `string`、不带 `omitempty`**：
        没有科目/老师时吐的是**空串 `""`**，键恒在，也不会是 `null`。所以这两个字段
        不写 `nullable: true`（那会声明一个永远不会出现的 `null`），但客户端必须用
        `|| '—'` 或显式判空串来回落 —— **`?? '—'` 兜不住空串，会渲染出一段空白**。
        （`GET /trials` 那条路上的 `model.Trial.subject_name` 才是带 `omitempty`、
        为空时整键缺席的那一个，那边 `??` 才成立。两条路的要求刚好相反。）
        本 schema 的字段本就非 required。
      properties:
        id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        student_name: { type: string }
        subject_name:
          type: string
          description: 带 omitempty：无科目时键缺席（undefined），不是 null
        teacher_name:
          type: string
          description: 带 omitempty：无老师时键缺席（undefined），不是 null
        scheduled_at: { type: string, format: date-time }
        duration_min:
          type: integer
          example: 60
          description: |
            试听时长（分钟）。**两段试听队列靠它区分**：`scheduled_at + duration_min <= now`
            即「已上完」，这正是 `awaiting_outcome_trials` 的判据，也是前端决定
            「记录结果」按钮能不能点的依据。
            服务端**刻意不下发**算好的结束时刻或一个 `ended` 布尔位：「有没有上完」是
            展示期判断，而 `frontend/src/lib/format.ts` 的 `hoursSinceEnd(startIso, durationMin)`
            已经在做同一件事（`GET /trials` 那条路也走它）。两边共用一处实现，
            比每个端点各发一个自己的派生字段更不容易走样。
            判定要用 `COALESCE(duration_min, 60)`：列在 schema 里可空，
            尽管 CreateTrial 会给它填 60（service/trial.go:45-47）。
        outcome: { type: string, enum: [pending, converted, lost] }

    LowCreditRow:
      type: object
      description: |
        **刻意没有 "还能上几周" 字段**（handler/dashboard.go:56-60）：估算耗尽时间需要每个学生的
        每周消耗速率，本项目没有计算它。契约若声明一个永不填充的字段，比不声明更糟 ——
        客户端会在本该显示数字的位置渲染空白，且无法与"真的为 0"区分。
      properties:
        student_id: { type: integer, format: int64 }
        full_name: { type: string }
        balance: { type: integer, description: "剩余课时，可能为负（透支）" }
        total_credits: { type: integer, description: "该生所有 active 课包的总课时" }

    TeacherDashboard:
      type: object
      properties:
        today:
          type: array
          default: []
          description: "今日及以后未取消的课（`lesson_date >= 今天`），上限 30；`start_clock` 由服务端格式化"
          items: { $ref: '#/components/schemas/TeacherLessonRow' }
        missing_roll_call:
          type: integer
          description: "过去日期里仍为 `scheduled` 且有在册学生的课次数（待补点名）"

    TeacherLessonRow:
      type: object
      properties:
        id: { type: integer, format: int64 }
        class_id: { type: integer, format: int64 }
        class_name: { type: string }
        subject_name: { type: string, nullable: true }
        lesson_date: { type: string, format: date }
        start_min: { type: integer, description: "自 00:00 起的分钟数（墨尔本墙上时间）" }
        start_clock: { type: string, description: "服务端格式化的起始时钟，如 `\"16:00\"`", example: "16:00" }
        status: { type: string, enum: [scheduled, cancelled, completed] }
        students: { type: integer, description: "在册学生数（`class_enrollments.status='active'`）" }
        new_faces: { type: integer, description: "该班首次出现在此学生课表上的人数（此前该班无出勤记录）" }
        on_leave: { type: integer, description: "本课次已提交请假的学生数" }
        recorded: { type: integer, description: "本课次已记录出勤的人数；`0` 即尚未点名" }

    HouseholdStudentRow:
      type: object
      description: "家长端首屏的孩子行：先给余额，再由此进入逐条流水"
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string }
        balance: { type: integer, description: "剩余课时（`v_student_balance`），无流水时为 0" }
        status: { type: string, enum: [lead, trial, active, churned] }
