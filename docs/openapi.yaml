                        type: array
                        default: []
                        items: { $ref: '#/components/schemas/FollowUp' }

  /follow-ups/{id}/complete:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [followups]
      summary: 完成跟进
      description: |
        **R7 写校验（同时堵一个 IDOR）**：`id` 本身不是授权凭据。事务内先按 id 查出
        `follow_ups.student_id`（查不到 → 404 / code=40400），再对该学生执行
        `StudentService.AssertOwner`（`service/student.go:18`），非本人学生即
        `403 / code=40301`。此前只按 id 直接 UPDATE，换个 id 就能关掉别人的跟进单。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/OkEmpty' }
        '403':
          description: "R7 违反：code=40301 —— 该跟进单的学生不属于当前顾问"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classes:
    get:
      tags: [classes]
      summary: 班级列表
      description: |
        读作用域：admin / teacher 返回全部**启用中**的班级；**household(role=student) 只返回其孩子处于
        `status='active'` 报名的班级**（收敛在 SQL 里，scheduling.go:49-58，不留给客户端过滤）。
        只返回 `status='active'` 的班级（scheduling.go:33），归档班不出现在列表里。
        排序固定为 `weekday, start_min`（即按周课表顺序）。
        **空集合契约**：无匹配时 `data` 恒为 `[]`，绝不返回 `null`。
      parameters:
