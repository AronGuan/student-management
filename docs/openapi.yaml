  /trials:
    get:
      tags: [trials]
      summary: 试听列表
      description: |
        **这是顾问的个人待办队列，不是学生目录**，因此按角色收口（handler/trial.go:41-66）：
        admin 只返回 `students.owner_admin_id = 自己` 的试听，teacher 只返回 `trials.teacher_id = 自己`
        的试听。两条谓词都拼进 SQL，**不留给客户端过滤**（否则"过滤失效 = 全量泄露"）。

        **为什么不与 R7 冲突**：R7 管的是**学生目录**（`DESIGN.md:116`：admin 可读全部学生、
        只可写 `owner_admin_id = self` 的），`GET /students` 仍不按 owner 收口并逐行带 `can_write`
        标记，那条「读全部学生」的能力没有被削弱（它只按 status 收口到已成交的人，见该端点
        `status` 参数的说明）。本端点是「今天我桌上有什么」，与同页、同角色门、
        同一文件的 `GET /follow-ups` 完全同口径 —— 把整家公司的名单铺到某个顾问的工作台上
        不是权限，而是噪音，用户实际反馈过这个 bug。历史上这里没有过滤，前端因此绕行改读
        `/dashboard/admin`（`frontend/src/pages/TodayPage.tsx:9-13` 的注释记录了那次绕行），
        而 LeadsPage 仍在直接调本端点，本轮把端点本身修掉。

        **空集合契约**：无匹配时 `data.items` 恒为 `[]`，**绝不返回 `null`**（客户端 `.map()` 不得
        因空集合崩溃）。空集合现在有两种来路，都必须落在 `items: []`：筛选无匹配，以及**页码越界**
        （`page` 大于总页数，例如只有 2 页时请求 `page=99`）—— 后者同样返回 `has_more: false`。

        **服务端分页**：`page` / `limit` 决定返回第几页（默认 `page=1`、`limit=20`，`limit` 上限
        **200**，越界回落 20，见 `components/parameters/Limit`）。`total` 是**同一组谓词**下过滤集
        的总行数，`items` 那一页与它出自同一个 `WHERE`（含下面的角色收口），所以 `total` 不会比
        `items` 可见范围更宽。**`ORDER BY` 以唯一键 `t.id DESC` 收尾**（`scheduled_at` 不唯一，
        seed 会成批写入同一挂钟时刻），因此翻页既不会漏行也不会重复行：把第 1 页与第 2 页的
        `items[].id` 并起来去重，行数**恰好等于 `total`** —— 这也是手工验证清单里的验收断言。
        此前本端点没有分页参数，尾部硬编码 `LIMIT 100`，超过 100 条会**静默截断**且调用方无从得知。

        **排序随 `outcome` 分档**。三档都是「最近的在前」，但 `outcome=pending`（待记录结果）
        额外多一个前置键：`(scheduled_at + COALESCE(duration_min,60) MINUTE) <= now` 的行排在
        前面，之后才按 `scheduled_at DESC`。原因是这一档同时装着两种东西 —— **还没上过的课**
        （seed 铺到 `now + 1..9` 天）和**已经上完但没人记结果**的课，而后者才是顾问今天要处理的。
        纯按时间倒序时它们沉在列表末尾、多数落在下一页之外，第 1 页读起来「今天没事干」。
        分档只在 `pending` 下生效：另两档是历史列表，每行都已结束 —— 但若有人在开课前就记了
        结果，那个键在那两档里不是常量，而那一行只是「最新的一条」，不是「最不紧急的一条」。
        判据用「开始 + 时长」而非「开始」，因为 60 分钟的课在开课那一刻并没有结束。
        排序键仍以唯一键 `t.id DESC` 收尾，所以上一条翻页断言不受影响。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: student_id
          in: query
          description: |
            按学生过滤。**非数字取值一律 `400 / code=40000`**（`"student_id 必须是数字"`），
            不静默忽略。此前它被当字符串直接拼进 SQL，`?student_id=abc` 不报错、匹配不到任何行，
            调用方会把「过滤没生效」读成「该学生没有试听」。
          schema: { type: integer, format: int64 }
        - name: outcome
          in: query
          description: |
            按试听结果过滤。`pending` 就是页面上的「待记录结果」档 —— 注意它**同时装着两种
            东西**：还没上过的课，和已经上完但没人记结果的课（服务端把后者排在最前，见上）。
            所以这一档**不等于**「结果填漏了的那些」，取名时不要按后者去理解。
            `converted` / `lost` 是历史列表，都是已经结束的课。
          schema: { type: string, enum: [pending, converted, lost] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                default: []
                                items: { $ref: '#/components/schemas/Trial' }
        '400':
          description: "数字型 query 参数无法解析：code=40000，例如 \"student_id 必须是数字\""
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
    post:
      tags: [trials]
      summary: "安排试听（R1：同学生同科目只能试听一次）"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrialRequest' }
      responses:
        '201':
          description: 已安排
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Trial' }
        '400':
          description: "subject_id / teacher_id 任一缺失或为 0：code=40000（此前 teacher_id 缺失会被静默接受、落库为 NULL —— 本次修复的真实缺陷）。student_id 缺失或指向不存在的学生时，更早地被 handler 的 R7 归属校验拦下，返回 404 / code=40400。"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '409':
          description: "R1 违反：code=40905"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  /trials/{id}/outcome:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [trials]
      summary: "标记试听结果 → R2 自动生成 due_at = now + 48h 的跟进任务"
      description: |
        **R7 写校验**：这是写路径，事务内先按 `t.student_id` 回查归属，非本人学生即
        `403 / code=40301`（`service/trial.go` 复用 `StudentService.AssertOwner`，
        `service/student.go:18`）。此前这里漏了校验，等于任何 admin 都能把结果写进别人的试听。

        **状态推进**：`outcome=converted` 会把该学生的 `students.status` 从 `lead` / `trial`
        推进到 `active`（`UPDATE ... WHERE status IN ('lead','trial')` 作守卫：既不复活已
        `churned` 的，也不覆写已 `active` 的）；`outcome=lost` **完全不动** `students.status`
        —— 未转化的线索要留在顾问队列里继续挽回，置成 `churned` 等于自动放弃。
        生命周期见 `model/model.go:41`（`lead -> trial -> active -> churned`）。

        **审计**：同一事务内写一条 `audit_events`（`entity='trial'`、`action='outcome'`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [converted, lost] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      # 以运行时为准：handler 的 SetOutcome 直接 `OK(c, fu)`，`data` 就是新建的
                      # FollowUp 本身，**没有** `{ trial, follow_up }` 这层包装（旧草案写错了）。
                      # 前端曾按草案的包装写法做过防御，本轮已按实现删除，
                      # 这里按实现校正，避免契约继续声明一个服务端从不返回的形状。
                      data: { $ref: '#/components/schemas/FollowUp' }
        '403':
          description: "R7 违反：code=40301 —— 该试听的学生不属于当前顾问"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }
        '404': { $ref: '#/components/responses/NotFound' }

  /follow-ups:
    get:
      tags: [followups]
      summary: 跟进任务列表
      description: |
        与 `GET /trials` 同页、同角色门、同口径：`admin` 只看到 `students.owner_admin_id = 自己`
        的跟进（`handler/trial.go` 的 `ListFollowUps` 把 `cu.ID` 填进 `FollowUpFilter.OwnerAdminID`），
