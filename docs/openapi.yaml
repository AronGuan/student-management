      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Class' }
        '409':
          description: "code=40902 老师时段冲突"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorBody' }

  # 说明：首版规格在此声明过 `GET /classes/{id}`（班级详情，附 enrolled_count / seats_left），
